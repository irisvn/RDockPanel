# The panel's image, ghcr.io/irisvn/rdockpanel.
# - A push to main builds it natively for amd64 and arm64, joined in one
#   multi-arch image tagged `main` and `main-<commit>`. Its version is
#   Cargo.toml's (the binary's too: build.rs).
# - A version tag (`vX.Y.Z`, pushed after main's CI passed) builds nothing:
#   it names that commit's image `X.Y.Z`, `X.Y`, `vX.Y.Z` and `latest`, once
#   Cargo.toml says the same version.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation alone changes no image (tags are never filtered by path).
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]

# One publication at a time per ref: tags are never written out of order.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Lowercase, as image names must be (the repository is irisvn/RDockPanel).
  IMAGE: ghcr.io/irisvn/rdockpanel

jobs:
  build:
    if: github.ref_type == 'branch'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "value=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            RDP_COMMIT=${{ github.sha }}
            RDP_VERSION=${{ steps.version.outputs.value }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "$IMAGE:main" -t "$IMAGE:main-${GITHUB_SHA::7}" \
            $(printf "$IMAGE@sha256:%s " *)

  # A release: main's image of the tagged commit, named.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The GitHub Release (its notes: the CHANGELOG's section), after the
    # image is named: what Settings → Version shows.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the commit's image
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$cargo" ]; then
            echo "::error::the tag says $version, Cargo.toml $cargo"
            exit 1
          fi
          source="$IMAGE:main-${GITHUB_SHA::7}"
          if ! docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
            echo "::error::$source is not built: push the commit to main (and let it build) before tagging it"
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:$version" \
            -t "$IMAGE:${version%.*}" -t "$IMAGE:latest" "$source"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The CHANGELOG's section of this version (from its heading to the next).
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          # Run again (the image named, the release not): updated, not doubled.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "RDockPanel $version" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "RDockPanel $version" --notes-file notes.md --verify-tag --latest
          fi
