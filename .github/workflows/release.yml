# The panel's image, ghcr.io/irisvn/rdockpanel: built natively for amd64 and
# arm64 on pushes to main (tags `main` and `main-<commit>`) and on version
# tags (`X.Y.Z`, `X.Y` and `latest`: releases only), then joined in one
# multi-arch tag. The binary knows its version and commit (build.rs).
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

# One publication at a time per ref: tags are never written out of order.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A tag's version without its `v` (v0.4.0 → 0.4.0), as the binary and
      # the image's labels show it.
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; fi
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            RDP_COMMIT=${{ github.sha }}
            RDP_VERSION=${{ steps.version.outputs.value }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        working-directory: /tmp/digests
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            # v1.2.3 → 1.2.3, 1.2 and latest (v1.2.3 too, as before).
            version="${GITHUB_REF_NAME#v}"
            tags="-t $IMAGE:${GITHUB_REF_NAME} -t $IMAGE:$version -t $IMAGE:${version%.*} -t $IMAGE:latest"
          else
            tags="-t $IMAGE:main -t $IMAGE:main-${GITHUB_SHA::7}"
          fi
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
