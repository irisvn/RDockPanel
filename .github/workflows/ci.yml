# On pushes to main and pull requests: formatting, lints, the tests on MySQL 8.4
# (the panel's only database: `RUSTCMS_TEST_BACKENDS=mysql` runs no other).
# `Cargo.lock` is committed: CI builds exactly the versions you tested.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 2s --health-timeout 3s --health-retries 60
        ports:
          - 3306:3306
    env:
      RUSTCMS_TEST_MYSQL: mysql://root:root@127.0.0.1:3306/mysql
      RUSTCMS_TEST_BACKENDS: mysql
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The Docker and Swarm code against the runner's real engine, made a
  # single-node Swarm, and a whole deployment through the panel.
  docker:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 2s --health-timeout 3s --health-retries 60
        ports:
          - 3306:3306
    env:
      PANEL_TEST_DOCKER: "1"
      PANEL_TEST_SWARM: "1"
      RUSTCMS_TEST_MYSQL: mysql://root:root@127.0.0.1:3306/mysql
      RUSTCMS_TEST_BACKENDS: mysql
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      # A single-node Swarm and Traefik on 8080/8443, as in development.
      - run: sh scripts/dev-swarm.sh
      - run: "cargo test --locked --test feature docker::"
      - run: cargo test --locked --test feature deployments_on_a_real_swarm
      - run: cargo test --locked --test feature domains_route_through_traefik

  # The React pages: types, a build, and the committed bundles up to date
  # (cargo build reads them, so it needs no Node).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resources/admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code -- js css .rustcms-build.json
