# RDockPanel's WAF, Block mode, Strict level: Basic + the OWASP Core Rule
# Set, all checked before the request reaches the app (CrowdSec's own CRS
# config runs it after the request: it would not stop it).
name: rdp/appsec-strict
default_remediation: ban
inband_rules:
  - crowdsecurity/base-config
  - crowdsecurity/vpatch-*
  - crowdsecurity/generic-*
  - crowdsecurity/crs
# The panel's own canary (a test attack every minute, to prove the WAF is
# on): blocked like any request, but no alert and no event.
on_match:
  - filter: req.Host == "rdp-waf-canary.invalid"
    apply:
      - CancelAlert()
      - CancelEvent()
