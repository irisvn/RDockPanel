# RDockPanel's WAF, Detect mode: the same rules after the request (never
# blocking); matches become alerts (scenario rdp/appsec-detect).
name: rdp/appsec-detect
outofband_rules:
  - crowdsecurity/base-config
  - crowdsecurity/vpatch-*
  - crowdsecurity/generic-*
# The panel's own canary through this listener (a test attack every minute,
# to prove Detect checks requests): no alert and no event.
on_match:
  - filter: req.Host == "rdp-waf-canary-detect.invalid"
    apply:
      - CancelAlert()
      - CancelEvent()
