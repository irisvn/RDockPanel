# Workers take jobs from these queues (the default is only "default"):
# "docker" pulls images, "deploy" deploys services (Phase 2).
queues = ["default", "docker", "deploy", "backup", "import"]
# One pool serves every queue: an import (a copy, a deploy) must not starve
# the other jobs, nor they the import.
workers = 4
# A database backup or restore may take up to 3 hours (backup.run).
max_timeout_secs = 10800
