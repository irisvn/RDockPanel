# RDockPanel's own settings (`[panel]`; override with RUSTCMS_PANEL__<KEY>).

# Host directories services may bind-mount, for users with `system.manage`.
# Empty: no bind mounts (named volumes only). Each root must also be visible
# to the panel at the same path (the installer mounts it read-only), so
# sources are resolved (symlinks included) before they are allowed. Only list
# directories no service and no untrusted user can write (see docs/security.md).
bind_roots = []

# Ports services may not publish: the proxy's, the panel's.
reserved_ports = [80, 443, 3000, 8000, 8080, 8443]

# Traefik's certificate resolver for HTTPS domains ("letsencrypt" in
# production, from the installer). Empty: Traefik's default (self-signed)
# certificate, as in development.
cert_resolver = ""

# The public HTTPS port HTTP is redirected to (development: 8443, set in .env
# as RUSTCMS_PANEL__HTTPS_PORT).
https_port = 443

# Traefik's file provider directory: the panel writes one file of routes per
# service there (the installer: /etc/rdockpanel/traefik/dynamic). Relative
# paths are from the panel's working directory.
traefik_dir = "storage/traefik/dynamic"

# Traefik's Swarm service: attached to each project's network so it reaches
# the services there (scripts/dev-swarm.sh and the installer name it so).
traefik_service = "rdp-traefik"

# The domain generated service domains live under: `<project>-<service>.<this>`
# (point a wildcard DNS record `*.<this>` to the server). Empty: none
# generated. Development: "localhost" (set in .env), so http://shop-web.localhost:8080.
service_domain = ""

# The server's public IP address, for `$(EASYPANEL_HOST_IP)` in environments.
public_ip = ""

# Where EasyPanel's templates are fetched from when the catalog is opened
# (raw files of their repository's templates/ folder; never bundled).
templates_url = "https://raw.githubusercontent.com/easypanel-io/templates/main/templates"
