[package]
name = "rdockpanel"
version = "0.1.0"
edition = "2024"
description = "Free, self-hosted server panel like EasyPanel: server monitoring and Docker management (Swarm deployment in progress)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/irisvn/rdockpanel"
publish = false

[package.metadata.rustcms]
version = "0.5.0"

[dependencies]
rustcms = { git = "https://github.com/irisvn/RustCMS-Core", tag = "v0.5.0" }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "with-chrono", "with-uuid", "with-rust_decimal", "with-json"] }
sea-orm-migration = { version = "=2.0.4", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = "0.21"
sysinfo = "0.39"
futures-util = "0.3"
rustix = { version = "1", features = ["fs", "process"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "io-util", "process"] }
thiserror = "2"
tracing = "0.1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde_yaml_ng = "0.10"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
getrandom = "0.3"
percent-encoding = "2"
# EasyPanel templates: TypeScript generators run in QuickJS (types stripped by oxc).
rquickjs = { version = "0.14", features = ["loader"] }
oxc = { version = "0.154", features = ["transformer", "codegen", "semantic"] }
bcrypt = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
shell-words = "1.1"

[dev-dependencies]
insta = "1"
rustcms-testing = { git = "https://github.com/irisvn/RustCMS-Core", tag = "v0.5.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
[workspace]
