[package]
name = "rdockpanel"
version = "0.1.0"
edition = "2024"
description = "Free, self-hosted server panel like EasyPanel: server monitoring and Docker management (Swarm deployment in progress)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/irisvn/rdockpanel"
publish = false

[package.metadata.rustcms]
version = "0.6.1"

[dependencies]
rustcms = { git = "https://github.com/irisvn/RustCMS-Core", tag = "v0.6.1" }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "with-chrono", "with-uuid", "with-rust_decimal", "with-json"] }
sea-orm-migration = { version = "=2.0.4", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = { version = "0.21", features = ["buildkit_providerless", "chrono"] }
sysinfo = "0.39"
futures-util = "0.3"
rustix = { version = "1", features = ["fs", "process"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "io-util", "process", "fs"] }
thiserror = "2"
tracing = "0.1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
serde_yaml_ng = "0.10"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
getrandom = "0.3"
percent-encoding = "2"
globset = "0.4"
regex = "1"
croner = "4"
flate2 = "1"
rusty-s3 = "0.10"
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls", "webpki-roots", "aws-lc-rs"] }
tar = "0.4"
# EasyPanel templates: TypeScript generators run in QuickJS (types stripped by oxc).
rquickjs = { version = "0.14", features = ["loader"] }
oxc = { version = "0.154", features = ["transformer", "codegen", "semantic"] }
bcrypt = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
shell-words = "1.1"
x509-parser = { version = "0.18.1", features = ["verify"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }

[dev-dependencies]
insta = "1"
rcgen = "0.14.10"
rustcms-testing = { git = "https://github.com/irisvn/RustCMS-Core", tag = "v0.6.1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
[workspace]
